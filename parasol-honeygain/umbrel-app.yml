manifest-version: "1"
id: "parasol-honeygain"
name: "Honeygain"
tagline: "Passive bandwidth monetization client"
description: >-
  Honeygain is a crowdsourced residential proxy network that allows you to share
  your unused internet bandwidth and earn passive income.
developer: "Honeygain & Custom Parasol Port"
website: "https://www.honeygain.com"
version: "0.1.0"
category: "Utilities"
port: 0
permissions: []
parameters:
  honeygain_mail:
    type: "string"
    name: "Honeygain Account Email"
    description: "The email address associated with your Honeygain account."
    required: true
  honeygain_pw:
    type: "password"
    name: "Honeygain Account Password"
    description: "Your Honeygain account password."
    required: true
  device_id:
    type: "string"
    name: "Device Identifier"
    description: "Unique name for this node in your dashboard."
    default: "parasol-worker-01"
    required: false
